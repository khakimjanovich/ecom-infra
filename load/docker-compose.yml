# The system under load, sized like its target server: 1 CPU, 2 GB RAM (and a 256 GB SSD, which
# Docker can't limit per container; it is the host's disk). Each deployable runs its Gradle-built jar
# on the plain JRE image, untouched; the limits and JVM options live here, not in the code. It joins
# the main stack's network and uses its Postgres, Redis, Keycloak, Vault, Mailpit, file store (S3) and
# processing sandbox.
#
#   (in ecom) ./gradlew :app:bootJar
#             ./gradlew -p adapters/uzcard-adapter bootJar
#             ./gradlew -p adapters/humo-adapter bootJar
#   docker compose up -d                               # the main stack first
#   docker compose -f load/docker-compose.yml up -d    # then this: the app on http://localhost:8085
name: ecom-load

x-server: &server
  image: eclipse-temurin:25-jre
  user: "10001"
  deploy:
    resources:
      limits: { cpus: "1", memory: 2G }
  environment: &jvm
    # The heap follows the container's memory limit.
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    # Traces, metrics and logs go to the observability service on the stack's network.
    LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs # logs as ECS JSON, for machines
    OTLP_TRACES_ENDPOINT: http://observability:4318/v1/traces
    OTLP_METRICS_ENDPOINT: http://observability:4318/v1/metrics
    OTLP_LOGS_ENDPOINT: http://observability:4318/v1/logs

services:
  app:
    <<: *server
    command: ["java", "-jar", "/opt/ecom/app.jar"]
    volumes: ["${ECOM_DIR:-../../ecom}/app/build/libs/app.jar:/opt/ecom/app.jar:ro"]
    ports: ["8085:8080"]
    environment:
      <<: *jvm
      DB_URL: jdbc:postgresql://postgres:5432/acquiring
      # Each module has its own pool (ecom.db.<module>.hikari.*). Sized for this 1-CPU server and
      # its traffic: payments and cards are on every payment's path, the rest serve the portal.
      # Hikari's own sizing rule (cores x 2 + 1) per hot module; 25 connections in all.
      ECOM_DB_PAYMENT_HIKARI_MAXIMUM_POOL_SIZE: "6"
      ECOM_DB_CARD_HIKARI_MAXIMUM_POOL_SIZE: "6"
      ECOM_DB_PARTNER_HIKARI_MAXIMUM_POOL_SIZE: "4"
      ECOM_DB_COMMISSION_HIKARI_MAXIMUM_POOL_SIZE: "3"
      ECOM_DB_EPOS_HIKARI_MAXIMUM_POOL_SIZE: "3"
      ECOM_DB_BIN_HIKARI_MAXIMUM_POOL_SIZE: "3"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      KEYCLOAK_URL: http://keycloak:8080
      # Tokens name localhost:8180 as their issuer (KC_HOSTNAME); keys are fetched inside the network.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/ecom
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/ecom/protocol/openid-connect/certs
      VAULT_URL: http://vault:8200
      UZCARD_ADAPTER_URL: http://uzcard-adapter:8091
      HUMO_ADAPTER_URL: http://humo-adapter:8092
      S3_ENDPOINT: http://file-store:8333
      TEMPORAL_TARGET: temporal:7233
      KAFKA_BOOTSTRAP: kafka:9092
      # Websites in the load test send webhooks to the sandbox's merchant endpoint.
      WEBHOOK_TEST_HOSTS: processing-sandbox
    depends_on: [uzcard-adapter, humo-adapter]

  uzcard-adapter:
    <<: *server
    command: ["java", "-jar", "/opt/ecom/uzcard-adapter.jar"]
    volumes: ["${ECOM_DIR:-../../ecom}/adapters/uzcard-adapter/build/libs/uzcard-adapter.jar:/opt/ecom/uzcard-adapter.jar:ro"]
    environment:
      <<: *jvm
      UZCARD_URL: http://processing-sandbox:8080/uzcard

  humo-adapter:
    <<: *server
    command: ["java", "-jar", "/opt/ecom/humo-adapter.jar"]
    volumes: ["${ECOM_DIR:-../../ecom}/adapters/humo-adapter/build/libs/humo-adapter.jar:/opt/ecom/humo-adapter.jar:ro"]
    environment:
      <<: *jvm
      HUMO_PAYMENT_SERVER_URL: http://processing-sandbox:8080/humo/PaymentServer
      HUMO_MIDDLEWARE_URL: http://processing-sandbox:8080/humo-middleware


networks:
  default:
    name: ecom_default
    external: true

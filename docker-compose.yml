# Local environment for ecom.
name: ecom

services:
  postgres:
    image: postgres:17.6-alpine
    # Each app instance opens a pool per module; several instances run side by side locally.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_DB: acquiring
      POSTGRES_USER: acquiring_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only}
    ports: ["5442:5432"] # 5432 is often taken on dev machines
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acquiring_admin -d acquiring"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8.2-alpine
    ports: ["6389:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web inbox and API

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: start-dev --import-realm
    # Without a limit its JVM sizes itself from the whole Docker VM and is the first to be killed
    # when memory runs short; with one, its heap follows this limit.
    deploy:
      resources:
        limits: { memory: 1G }
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-only}
      KC_HOSTNAME: http://localhost:8180 # one token issuer for the app, the browser and tools running in Docker
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports: ["8180:8080"]
    volumes:
      - ./keycloak/ecom-realm.json:/opt/keycloak/data/import/ecom-realm.json:ro
      - ./keycloak/themes/ecom:/opt/keycloak/themes/ecom:ro

  # Simulated delays (a scheme that never answers) don't hold request threads, and the request
  # journal keeps only the latest requests, so a long load run stays fast.
  processing-sandbox:
    image: wiremock/wiremock:3.13.1
    command: ["--global-response-templating", "--disable-banner", "--max-request-journal-entries", "2000", "--async-response-enabled", "true", "--async-response-threads", "50"]
    ports: ["8099:8080"] # stands in for Uzcard and Humo; see processing-sandbox/README.md
    volumes:
      - ./processing-sandbox/mappings:/home/wiremock/mappings:ro

  vault:
    image: hashicorp/vault:1.20.4
    command: ["server", "-dev"] # in memory: secrets are gone after a restart
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: local-only
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add: [IPC_LOCK]
    ports: ["8200:8200"] # http://localhost:8200, token local-only; merchants' signing keys under secret/merchants

  # One shot: the app's local-only secrets into Vault at secret/ecom (vault/seed.sh), after every start.
  vault-seed:
    image: hashicorp/vault:1.20.4
    entrypoint: ["/bin/sh", "/seed.sh"]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: local-only
    volumes: ["./vault/seed.sh:/seed.sh:ro"]
    depends_on: [vault]
    restart: "no"

  file-store:
    image: chrislusf/seaweedfs:3.97
    # An S3-compatible store for the app's files; in production, any S3.
    command: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data", "-master.volumeSizeLimitMB=64", "-volume.max=0"] # 0: as many volumes as the disk allows
    ports: ["8333:8333"] # S3 API, access key ecom / local-only
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - file-store-data:/data

  # One shot: the app's buckets (seaweedfs/init.sh). The app's identity may only read, write and list
  # them (seaweedfs/s3.json); it creates nothing.
  file-store-init:
    image: chrislusf/seaweedfs:3.97
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes: ["./seaweedfs/init.sh:/init.sh:ro"]
    depends_on: [file-store]
    restart: "no"

  # Temporal, for durable waits: resolving debits the scheme didn't answer. The dev server keeps
  # its state in memory; the UI is on http://localhost:8233.
  # Payment events (KRaft, one node). Containers use kafka:9092; the app on the host uses localhost:9102.
  kafka:
    image: apache/kafka:4.3.1
    ports: ["9102:9102"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9102,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9102
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  temporal:
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-ip", "0.0.0.0"]
    ports: ["7233:7233", "8233:8233"]

  # Metrics, traces and logs in one place: an OpenTelemetry collector (OTLP on 4317/4318) feeding
  # Prometheus, Tempo and Loki, with Grafana on http://localhost:3030. The app and the adapters send
  # their own traces, metrics and logs to it. Its alerts are in observability/alerting.
  observability:
    image: grafana/otel-lgtm:0.30.0
    ports: ["3030:3000", "4317:4317", "4318:4318"] # 3000 is often taken on dev machines
    environment:
      # Alerts go by email to Mailpit (http://localhost:8025); ALERT_EMAILS is the recipient list.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_FROM_ADDRESS: ${ALERT_FROM:-alerts@ecom.local}
      GF_SMTP_FROM_NAME: ecom alerts
      ALERT_EMAILS: ${ALERT_EMAILS:-oncall@ecom.local}
    volumes:
      - ./observability/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/ecom.yaml:ro
      - ./observability/dashboards:/otel-lgtm/ecom-dashboards:ro
      - ./observability/alerting/rules.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/ecom-rules.yaml:ro
      - ./observability/alerting/contact-points.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/ecom-contact-points.yaml:ro
      - ./observability/alerting/policies.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/ecom-policies.yaml:ro

volumes:
  postgres-data:
  file-store-data:

# Local environment for acquiring-backend. Tools join only when an episode needs them.
name: acquiring

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: acquiring
      POSTGRES_USER: acquiring_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only}
    ports: ["5432:5432"]
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acquiring_admin -d acquiring"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8.2-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-only}
    ports: ["8180:8080"]

volumes:
  postgres-data:

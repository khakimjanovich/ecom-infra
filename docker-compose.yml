# Local environment for ecom.
name: ecom

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: acquiring
      POSTGRES_USER: acquiring_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only}
    ports: ["5442:5432"] # 5432 is often taken on dev machines
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acquiring_admin -d acquiring"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8.2-alpine
    ports: ["6389:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web inbox and API

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-only}
      KC_HOSTNAME: http://localhost:8180 # one token issuer for the app, the browser and tools running in Docker
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports: ["8180:8080"]
    volumes:
      - ./keycloak/ecom-realm.json:/opt/keycloak/data/import/ecom-realm.json:ro
      - ./keycloak/themes/ecom:/opt/keycloak/themes/ecom:ro

  processing-sandbox:
    image: wiremock/wiremock:3.13.1
    command: ["--global-response-templating", "--disable-banner"]
    ports: ["8099:8080"] # stands in for Uzcard and Humo; see processing-sandbox/README.md
    volumes:
      - ./processing-sandbox/mappings:/home/wiremock/mappings:ro

  vault:
    image: hashicorp/vault:1.20.4
    command: ["server", "-dev"] # in memory: secrets are gone after a restart
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: local-only
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add: [IPC_LOCK]
    ports: ["8200:8200"] # http://localhost:8200, token local-only; merchants' signing keys under secret/merchants

  file-store:
    image: chrislusf/seaweedfs:3.97
    # An S3-compatible store for the file service; in production, any S3.
    command: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data", "-master.volumeSizeLimitMB=64", "-volume.max=8"]
    ports: ["8333:8333"] # S3 API, access key ecom / local-only
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - file-store-data:/data

volumes:
  postgres-data:
  file-store-data:

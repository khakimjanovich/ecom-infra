apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
  labels: { app: file-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: file-service }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: file-service }
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: file-service
          image: ecom/file-service:dev
          ports: [{ name: http, containerPort: 8093 }]
          envFrom:
            - configMapRef: { name: ecom-config }
            - configMapRef: { name: file-service-config }
            - secretRef: { name: ecom-secrets }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          lifecycle:
            preStop: { sleep: { seconds: 10 } }
---
apiVersion: v1
kind: Service
metadata:
  name: file-service
spec:
  selector: { app: file-service }
  ports: [{ name: http, port: 8093, targetPort: http }]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: file-service-config
data:
  S3_ENDPOINT: http://file-store:8333

# The app: three replicas behind one Service. Every scheduled job is safe on all three (ShedLock in
# the partner module; SKIP LOCKED or one workflow per payment in the payment module), and the Kafka
# listener shares the topic's partitions between them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels: { app: ecom-app }
spec:
  replicas: 3
  selector:
    matchLabels: { app: ecom-app }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } # a new pod is ready before an old one goes
  template:
    metadata:
      labels: { app: ecom-app }
    spec:
      terminationGracePeriodSeconds: 60 # longer than the slowest scheme call the app waits for
      containers:
        - name: app
          image: ecom/app:dev
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: ecom-config }
            - secretRef: { name: ecom-secrets }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "1", memory: 2Gi }
          # Spring Boot's own probes: liveness says the JVM is fine, readiness that it takes traffic.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36 # up to three minutes to start
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          lifecycle:
            # The Service stops sending new requests before the app starts its graceful shutdown.
            preStop: { sleep: { seconds: 10 } }
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector: { app: ecom-app }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: app }
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app
spec:
  minAvailable: 2 # a node drain never takes more than one replica at a time
  selector:
    matchLabels: { app: ecom-app }

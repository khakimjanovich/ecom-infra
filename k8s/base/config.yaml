# Where everything is. Secrets are not here: the app reads them from the ecom-secrets Secret, which
# the bank creates in the cluster (from Vault in production) and which never lives in git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecom-config
data:
  DB_URL: jdbc:postgresql://postgres:5432/acquiring
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  KEYCLOAK_URL: http://keycloak:8080
  VAULT_URL: http://vault:8200
  TEMPORAL_TARGET: temporal:7233
  KAFKA_BOOTSTRAP: kafka:9092
  UZCARD_ADAPTER_URL: http://uzcard-adapter:8091
  HUMO_ADAPTER_URL: http://humo-adapter:8092
  S3_ENDPOINT: http://file-store:8333
  # The heap follows the container's memory limit.
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75

# A one-node Kubernetes (k3s) for trying the manifests on a laptop. It joins the main stack's
# network, so the cluster reaches Postgres, Kafka and the rest at their compose addresses (see
# dependencies.sh). The app answers on http://localhost:30085.
#   docker compose up -d                                # the main stack first
#   docker compose -f k8s/local/docker-compose.yml up -d
name: ecom-k8s

services:
  k3s:
    image: rancher/k3s:v1.33.4-k3s1
    command: ["server", "--disable=traefik"]
    privileged: true
    tmpfs: [/run, /var/run]
    ports: ["6443:6443", "30085:30085"]
    volumes: ["k3s-data:/var/lib/rancher/k3s"]

volumes:
  k3s-data:

networks:
  default:
    name: ecom_default
    external: true
